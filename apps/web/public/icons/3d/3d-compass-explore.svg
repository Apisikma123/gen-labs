<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="r-comp-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r-comp-dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A4C"/>
      <stop offset="50%" stop-color="#151B16"/>
      <stop offset="100%" stop-color="#090D0A"/>
    </linearGradient>
    <linearGradient id="r-comp-needle-n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB4AB"/>
      <stop offset="50%" stop-color="#D9534F"/>
      <stop offset="100%" stop-color="#690005"/>
    </linearGradient>
    <linearGradient id="r-comp-needle-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CAD5CD"/>
      <stop offset="100%" stop-color="#414944"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="116" rx="40" ry="9" fill="url(#r-comp-shadow)"/>
  <!-- Outer Brass Ring -->
  <circle cx="64" cy="62" r="46" fill="#BA8230"/>
  <circle cx="64" cy="62" r="44" fill="#5B3900"/>
  <circle cx="64" cy="60" r="44" fill="url(#r-comp-dial)" stroke="#FFF2D6" stroke-width="2"/>
  <!-- Degree Graduations -->
  <circle cx="64" cy="60" r="36" stroke="#4B8F8C" stroke-width="1.5" stroke-dasharray="2 6" fill="none"/>
  <!-- Dynamic 3D Needle (North Diamond) -->
  <polygon points="64,26 71,58 64,60" fill="url(#r-comp-needle-n)"/>
  <polygon points="64,26 57,58 64,60" fill="#FFB4AB"/>
  <!-- Dynamic 3D Needle (South Diamond) -->
  <polygon points="64,94 71,62 64,60" fill="url(#r-comp-needle-s)"/>
  <polygon points="64,94 57,62 64,60" fill="#E6ECE8"/>
  <!-- Center Jewel Hub -->
  <circle cx="64" cy="60" r="5" fill="#FFFFFF"/>
  <circle cx="64" cy="60" r="2.5" fill="#BA8230"/>
  <!-- Specular Lens Curve -->
  <path d="M34 40C42 30 54 24 68 22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
</svg>